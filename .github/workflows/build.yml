name: Build

on:
  push:
    branches: [ "main" ]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            rid: linux-x64
            target: x86_64-unknown-linux-gnu
            use-nix: true
            shell: nix develop -c bash -eo pipefail {0}
            binary: agentic-filesystem-mcp

          - runs-on: ubuntu-24.04-arm
            rid: linux-arm64
            target: aarch64-unknown-linux-gnu
            use-nix: true
            shell: nix develop -c bash -eo pipefail {0}
            binary: agentic-filesystem-mcp

          - runs-on: windows-2025-vs2026
            rid: win-x64
            target: x86_64-pc-windows-msvc
            use-nix: false
            shell: pwsh
            binary: agentic-filesystem-mcp.exe

          - runs-on: windows-11-vs2026-arm
            rid: win-arm64
            target: aarch64-pc-windows-msvc
            use-nix: false
            shell: pwsh
            binary: agentic-filesystem-mcp.exe

    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        if: ${{ matrix.use-nix }}
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: Setup dev environment
        if: ${{ matrix.use-nix }}
        run: 'true'

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --verbose

      - name: Test
        run: cargo test --release --target ${{ matrix.target }} --verbose

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentic-filesystem-mcp-${{ matrix.rid }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agentic-filesystem-mcp-*
          path: artifacts
          github-token: ${{ github.token }}
          skip-decompress: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          FILES=(artifacts/*/*.zip)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              --clobber \
              "${FILES[@]}"
          else
            gh release create "$TAG" \
              --generate-notes \
              --prerelease="$IS_PRERELEASE" \
              "${FILES[@]}"
          fi
